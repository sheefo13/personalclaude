<!--
  DROP THESE INTO THE <head> OF EVERY PAGE ON thearabcardgame.com
  Replace placeholder values (marked with ALL_CAPS) with your real content.
-->

<!-- ─── Core identity ────────────────────────────────────────────────── -->
<html lang="en" dir="ltr">   <!-- change to lang="ar" dir="rtl" on Arabic pages -->

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<!-- Primary title pattern: [Product] | [Benefit] | The Arab Card Game -->
<title>The Arab Card Game – Fun Card Games Celebrating Arab Culture</title>

<meta name="description"
  content="The Arab Card Game brings Arab families and friends together with two hilarious, culture-rich card games. Perfect gift for the Arab Diaspora worldwide. Shop now and get free shipping on orders over $X." />

<!-- Canonical – prevents duplicate-content penalties -->
<link rel="canonical" href="https://www.thearabcardgame.com/" />

<!-- ─── Open Graph (Facebook, WhatsApp, Instagram link previews) ─────── -->
<meta property="og:type"        content="website" />
<meta property="og:url"         content="https://www.thearabcardgame.com/" />
<meta property="og:site_name"   content="The Arab Card Game" />
<meta property="og:title"       content="The Arab Card Game – Celebrate Arab Culture with Friends & Family" />
<meta property="og:description" content="Two hilarious card games made by Arabs, for Arabs (and everyone who loves them). Ships worldwide. Perfect eid, birthday, or housewarming gift." />
<meta property="og:image"       content="https://www.thearabcardgame.com/images/og-cover.jpg" />
<!-- og:image should be 1200×630 px, shows in WhatsApp/Facebook shares -->
<meta property="og:locale"      content="en_US" />
<meta property="og:locale:alternate" content="ar_SA" />

<!-- ─── Twitter / X card ─────────────────────────────────────────────── -->
<meta name="twitter:card"        content="summary_large_image" />
<meta name="twitter:site"        content="@YOUR_TWITTER_HANDLE" />
<meta name="twitter:title"       content="The Arab Card Game" />
<meta name="twitter:description" content="Card games made for Arab families, friends, and the diaspora worldwide." />
<meta name="twitter:image"       content="https://www.thearabcardgame.com/images/og-cover.jpg" />
